<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #db8629; } a:hover { color: #c26720; }
  </style>
</helmet>

<div dir="rtl" style="width: 412px; min-height: 900px; font-family: 'Rubik', system-ui, sans-serif; background: {{bg}}; color: {{ink}}; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 26px 20px 16px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <div style="width: 38px; height: 38px; border-radius: 11px; background: {{accent}}; color: #14243f; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="14" rx="2.5"/><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7M4 13h16"/></svg>
      </div>
      <div style="font-family: 'Secular One', sans-serif; font-size: 21px; letter-spacing: 0.01em;">הטיולים שלי</div>
    </div>
    <div style="min-height: 44px; display: flex; align-items: center; gap: 6px; background: {{accent}}; color: #14243f; border-radius: 11px; padding: 0 15px; font-size: 13.5px; font-weight: 500;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      טיול חדש
    </div>
  </div>

  <!-- the trip as a boarding pass -->
  <div style="margin: 6px 16px 0; position: relative;">
    <div style="background: {{card}}; border-radius: 20px 20px 0 0; padding: 20px; border: 1px solid {{line}}; border-bottom: none;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;">
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.18em; color: {{muted}};">TRIP · 2026</div>
          <div style="font-family: 'Secular One', sans-serif; font-size: 29px; margin-top: 7px; line-height: 1.06;">צפון יוון</div>
        </div>
        <div style="text-align: center; background: {{accentSoft}}; color: {{accentInk}}; border-radius: 12px; padding: 9px 12px; flex-shrink: 0;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; line-height: 1;">30</div>
          <div style="font-size: 10px; margin-top: 3px;">ימים</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 22px;">
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: 0.04em;">TLV</div>
          <div style="font-size: 11.5px; color: {{muted}}; margin-top: 3px;">17 ספט׳ · 06:20</div>
        </div>
        <div style="color: {{muted}}; transform: scaleX(-1);">
          <svg width="46" height="16" viewBox="0 0 46 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 8h34" stroke-dasharray="3 4"/><path d="M32 3.5 38 8l-6 4.5"/></svg>
        </div>
        <div style="text-align: end;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: 0.04em;">SKG</div>
          <div style="font-size: 11.5px; color: {{muted}}; margin-top: 3px;">סלוניקי</div>
        </div>
      </div>
    </div>

    <!-- perforation -->
    <div style="position: relative; height: 24px; background: {{card}}; border-inline: 1px solid {{line}};">
      <div style="position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: -11px; width: 22px; height: 22px; border-radius: 999px; background: {{bg}}; border: 1px solid {{line}};"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); inset-inline-end: -11px; width: 22px; height: 22px; border-radius: 999px; background: {{bg}}; border: 1px solid {{line}};"></div>
      <div style="position: absolute; top: 50%; inset-inline: 18px; border-top: 2px dashed {{line}};"></div>
    </div>

    <div style="background: {{card}}; border-radius: 0 0 20px 20px; padding: 4px 20px 20px; border: 1px solid {{line}}; border-top: none;">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em; color: {{muted}};">DAYS</div>
          <div style="font-size: 17px; font-weight: 500; margin-top: 4px;">7</div>
        </div>
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em; color: {{muted}};">PAX</div>
          <div style="font-size: 17px; font-weight: 500; margin-top: 4px;">3</div>
        </div>
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em; color: {{muted}};">BUDGET</div>
          <div style="font-size: 17px; font-weight: 500; margin-top: 4px;">₪35K</div>
        </div>
      </div>
      <div style="height: 6px; border-radius: 999px; background: {{track}}; margin-top: 16px; overflow: hidden;">
        <div style="width: 23%; height: 100%; border-radius: 999px; background: {{accent}};"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 7px; font-size: 11.5px; color: {{muted}};">
        <span>שולם ₪8,120</span><span>נותר ₪26,880</span>
      </div>
    </div>
  </div>

  <!-- schedule strip -->
  <div style="padding: 24px 20px 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <div style="font-family: 'Secular One', sans-serif; font-size: 15.5px;">לוח הימים</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{muted}};">7 / 7</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <div style="flex-grow: 1; background: {{d.bg}}; color: {{d.fg}}; border: 1px solid {{d.border}}; border-radius: 13px; padding: 11px 0; text-align: center;">
          <div style="font-size: 10.5px; opacity: 0.75;">{{d.dow}}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; margin-top: 3px;">{{d.num}}</div>
          <div style="width: 4px; height: 4px; border-radius: 999px; background: currentColor; margin: 6px auto 0; opacity: {{d.dot}};"></div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; gap: 12px; background: {{card}}; border: 1px solid {{line}}; border-radius: 15px; padding: 13px 15px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{accentInk}}; background: {{accentSoft}}; border-radius: 8px; padding: 5px 8px;">09:00</div>
      <div style="flex-grow: 1; font-size: 14px; font-weight: 400;">שוק מודיאנו</div>
      <div style="color: {{muted}};">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: {{card}}; border: 1px solid {{line}}; border-radius: 15px; padding: 13px 15px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{accentInk}}; background: {{accentSoft}}; border-radius: 8px; padding: 5px 8px;">11:30</div>
      <div style="flex-grow: 1; font-size: 14px; font-weight: 400;">המגדל הלבן</div>
      <div style="color: {{muted}};">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="border-top: 1px solid {{line}}; background: {{card}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 20px;">
    <div style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navOn}};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>
      <div style="font-size: 10.5px; font-weight: 500;">בית</div>
    </div>
    <div style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navOff}};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <div style="font-size: 10.5px; font-weight: 400;">מסלול</div>
    </div>
    <div style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navOff}};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
      <div style="font-size: 10.5px; font-weight: 400;">מפה</div>
    </div>
    <div style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navOff}};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/></svg>
      <div style="font-size: 10.5px; font-weight: 400;">תקציב</div>
    </div>
    <div style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{navOff}};">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      <div style="font-size: 10.5px; font-weight: 400;">עוד</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"תצוגה"}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const accent = dark ? '#eabd66' : '#db8629';
    const off = dark ? '#6b7688' : '#98a2b3';
    const line = dark ? '#242b3a' : '#e3e6ec';
    const card = dark ? '#161b26' : '#ffffff';
    const muted = dark ? '#97a1b4' : '#667085';
    const dayOn = { bg: dark ? '#1f2636' : '#eef2f9', fg: dark ? '#eef1f6' : '#131722', border: line, dot: '1' };
    const dayOff = { bg: 'transparent', fg: muted, border: line, dot: '0.25' };
    return {
      bg: dark ? '#0b0e15' : '#f4f6fa',
      navOn: accent,
      navOff: off,
      card, ink: dark ? '#eef1f6' : '#131722', muted, line, accent,
      accentSoft: dark ? '#2b2314' : '#fdf1de',
      accentInk: dark ? '#eabd66' : '#a14b1d',
      track: dark ? '#1c2230' : '#e9edf4',
      days: [
        { dow: 'ה׳', num: '17', ...dayOn },
        { dow: 'ו׳', num: '18', ...dayOff },
        { dow: 'ש׳', num: '19', ...dayOff },
        { dow: 'א׳', num: '20', ...dayOff },
        { dow: 'ב׳', num: '21', ...dayOff },
      ],
    };
  }
}
</script>
</body>
</html>
